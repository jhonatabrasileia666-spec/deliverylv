<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sabor do Campo | Cardápio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .welcome{position:relative;isolation:isolate;min-height:380px;padding-top:76px;padding-bottom:58px;overflow:hidden}
    .welcome:after{content:'';position:absolute;z-index:-1;right:-6%;top:28px;width:min(47vw,540px);height:340px;background:linear-gradient(90deg,rgba(11,11,11,0) 0%,rgba(11,11,11,.12) 18%,rgba(11,11,11,.38) 100%),url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=82') center/cover;filter:saturate(.9);clip-path:polygon(28% 0,100% 0,100% 100%,0 100%);opacity:.68}
    .welcome:before{content:'';position:absolute;z-index:-2;inset:0;background:radial-gradient(circle at 78% 45%,rgba(255,101,0,.14),transparent 30%),linear-gradient(110deg,rgba(255,101,0,.05),transparent 48%)}
    .welcome h1{max-width:620px;text-shadow:0 4px 24px #000}
    .welcome-copy{font-size:16px;max-width:430px}
    .store-status{background:rgba(21,21,21,.82);backdrop-filter:blur(6px)}
    .category-nav{padding-bottom:28px}
    .category{transition:color .2s,background .2s,border-color .2s,transform .2s}.category:hover{color:var(--text);border-color:var(--orange);transform:translateY(-2px)}
    .menu-section{padding-top:36px}.section-heading h2{font-size:38px}.product-card{overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.18)}.product-card>img{transition:transform .35s,filter .35s}.product-card:hover>img{transform:scale(1.04);filter:saturate(1.05)}
    .product-copy{background:linear-gradient(180deg,var(--surface),#111)}.add-button{transition:transform .2s,background .2s}.add-button:hover{background:var(--orange-2);transform:scale(1.08)}
    .cart-bar{max-width:470px;border:1px solid rgba(255,170,100,.5)}.cart-symbol{position:relative}.cart-symbol b{position:absolute;right:-9px;top:-7px;min-width:17px;height:17px;padding:0 4px;background:var(--orange);color:#1a0b03;border-radius:10px;font-size:10px;line-height:17px;font-weight:700}
    .checkout-summary{display:flex;justify-content:space-between;border-block:1px solid var(--line);padding:15px 0;margin:20px 0;color:var(--muted)}.checkout-summary strong{color:var(--orange);font:600 18px Outfit}.order-form{display:grid;gap:15px}.order-form label,.order-form legend{display:grid;gap:7px;color:var(--muted);font-size:12px}.order-form input,.order-form textarea{width:100%;resize:vertical;background:var(--surface-2);border:1px solid var(--line);padding:12px;color:var(--text);border-radius:2px}.order-form input:focus,.order-form textarea:focus{border-color:var(--orange);outline:none}.order-form fieldset{border:1px solid var(--line);padding:12px;margin:0;display:flex;gap:14px}.order-form fieldset legend{padding:0 4px}.order-form .choice{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px}.order-form .choice input{width:auto}.order-form button span{float:right;margin-left:12px}
    .cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary-action{min-height:48px;padding:0 14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700}.secondary-action:hover{border-color:var(--orange);color:var(--orange)}
    @media(max-width:700px){.welcome{min-height:0;padding-top:40px;padding-bottom:32px}.welcome:after{right:-28%;top:56px;width:72vw;height:230px;opacity:.3}.welcome:before{background:radial-gradient(circle at 92% 36%,rgba(255,101,0,.2),transparent 34%)}.welcome-copy{font-size:14px;max-width:280px}.section-heading h2{font-size:32px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-mark"><img class="brand-image" src="assets/logo-sabor-do-campo.svg" alt="Sabor do Campo - Pizzaria e Hamburgueria"><div class="brand-copy"><strong>SABOR DO CAMPO</strong><small>Pizzaria & Hamburgueria</small></div></div>
    <button class="icon-button" id="infoButton" aria-label="Informações da loja"><span class="icon">i</span></button>
  </header>

  <main>
    <section class="welcome wrap">
      <div><p class="eyebrow">Seu pedido começa aqui</p><h1>Sabor que reúne<br><em>todo mundo.</em></h1><p class="welcome-copy">Feito na hora, com aquele toque da casa que transforma qualquer encontro.</p></div>
      <div class="store-status"><span class="status-dot"></span><div><strong>Aberto agora</strong></div></div>
    </section>

    <nav class="category-nav" aria-label="Categorias" id="categoryNav"></nav>

    <section class="menu-section wrap">
      <div class="section-heading"><div><p class="eyebrow">Escolha seus favoritos</p><h2>Cardápio</h2></div><button class="search-button" id="searchButton" aria-label="Buscar produtos"><span class="icon">⌕</span></button></div>
      <div class="search-wrap" id="searchWrap" hidden><input id="searchInput" type="search" placeholder="Buscar no cardápio" aria-label="Buscar no cardápio"></div>
      <div class="product-grid" id="productGrid"></div>
    </section>
  </main>

  <button class="cart-bar" id="cartBar" hidden><span><span class="cart-icon">+</span><span id="cartSummary">Ver pedido</span></span><strong id="cartTotal">R$ 0,00</strong></button>
  <nav class="bottom-nav"><a class="active" href="#inicio"><span class="nav-symbol">⌂</span>Início</a><a href="#cardapio"><span class="nav-symbol">▦</span>Cardápio</a><a href="#pedido" id="bottomCart"><span class="nav-symbol cart-symbol">□<b id="cartBadge" hidden>0</b></span>Carrinho</a></nav>

  <div class="overlay" id="overlay" hidden></div>
  <section class="sheet" id="productSheet" hidden aria-modal="true" role="dialog"><button class="sheet-close" data-close aria-label="Fechar">×</button><div id="productDetail"></div></section>
  <section class="sheet cart-sheet" id="cartSheet" hidden aria-modal="true" role="dialog"><button class="sheet-close" data-close aria-label="Fechar">×</button><div id="cartDetail"></div></section>
  <div class="toast" id="toast" role="status"></div>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
