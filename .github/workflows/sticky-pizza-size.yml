name: Fix sticky pizza size selector

on:
  push:
    branches: [work-deliverylv]
    paths: ['.github/workflows/sticky-pizza-size.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix sticky scrolling container
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.shell{min-height:100vh;overflow:hidden}'
          new = '.shell{min-height:100vh;overflow-x:clip;overflow-y:visible}'
          if old not in s:
              raise SystemExit('Expected shell CSS not found')
          s = s.replace(old, new, 1)
          if '.pizza-size-filter-wrap{position:sticky;top:137px;' not in s:
              raise SystemExit('Sticky pizza size CSS missing')
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -F ".shell{min-height:100vh;overflow-x:clip;overflow-y:visible}" index.html
          grep -F ".pizza-size-filter-wrap{position:sticky;top:137px;" index.html
          git diff --check
      - name: Commit and push main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: allow pizza size selector to stick on mobile"
          git push origin HEAD:main
