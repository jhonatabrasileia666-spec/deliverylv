name: Sticky pizza size selector

on:
  push:
    branches: [work-deliverylv]
    paths: ['.github/workflows/sticky-pizza-size.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make P M G sticky
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.pizza-size-filter-wrap{margin:0 0 18px}'
          new = '.pizza-size-filter-wrap{position:sticky;top:137px;z-index:9;margin:0 0 18px;padding:8px;background:#11100ff2;backdrop-filter:blur(14px);border:1px solid #ffffff0d;border-radius:14px;box-shadow:0 10px 24px #0007}'
          if old not in s:
              raise SystemExit('Expected pizza size CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -F "position:sticky;top:137px" index.html
          git diff --check
      - name: Commit and push main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: keep pizza size selector visible while scrolling"
          git push origin HEAD:main
