name: Prelaunch hardening

on:
  push:
    paths:
      - '.github/workflows/prelaunch-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin browser dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          text=text.replace('https://unpkg.com/lucide@latest','https://unpkg.com/lucide@1.35.0')
          text=text.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0')
          if 'lucide@latest' in text or '@supabase/supabase-js@2\"' in text:
              raise SystemExit('Unpinned browser dependency remains')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              tmp=Path(f'/tmp/store-{i}.js')
              tmp.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(tmp)],check=True)
          print('Inline JavaScript valid')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/prelaunch-hardening.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: pin production browser dependencies'
          git push
