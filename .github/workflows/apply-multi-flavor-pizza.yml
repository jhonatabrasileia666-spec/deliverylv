name: Apply multi-flavor pizza fix

on:
  push:
    paths:
      - '.github/workflows/apply-multi-flavor-pizza.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply multi-flavor patch
        run: python .github/scripts/add-multi-flavor-pizza.py
      - name: Validate HTML markers and JavaScript syntax
        run: |
          grep -q "catalogPizzaSizes" index.html
          grep -q "data-flavor-id" index.html
          grep -q "payload.flavors" index.html
          grep -q "max_flavors" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit and clean temporary automation
        run: |
          rm -f .github/scripts/add-multi-flavor-pizza.py .github/workflows/apply-multi-flavor-pizza.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: support multiple pizza flavors by size'
          git push
