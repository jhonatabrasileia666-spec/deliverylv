name: Migrate product images to Supabase

on:
  push:
    branches: [work-deliverylv]
    paths: ['.github/workflows/migrate-product-images.yml']

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy external images into Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 300 \
            'https://nhvarlrbqbryrurpdwvp.supabase.co/functions/v1/migrate-product-images' \
            | tee /tmp/result.json
          echo
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          print('processed=', data.get('processed'))
          print('ok=', data.get('ok'))
          print('remaining=', data.get('remaining'))
          for x in data.get('failed') or []:
              print('FAILED:', x.get('name'), '-', x.get('error'))
          PY
