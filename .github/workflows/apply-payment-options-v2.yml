name: Apply payment options patch v2

on:
  push:
    branches:
      - work-deliverylv
    paths:
      - .github/workflows/apply-payment-options-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work-deliverylv
          fetch-depth: 0

      - name: Fix patch replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/patch_payment.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('send_fn + "\\n  function cartItemDetail", text, count=1, flags=re.S)', 'lambda _m: send_fn + "\\n  function cartItemDetail", text, count=1, flags=re.S)')
          s=s.replace('render_fn + "\\n  function getLocationFromGPS", text, count=1, flags=re.S)', 'lambda _m: render_fn + "\\n  function getLocationFromGPS", text, count=1, flags=re.S)')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply payment patch
        run: python .github/patch_payment.py

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/deliverylv-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/deliverylv-inline.js

      - name: Verify payment feature markers
        run: |
          grep -q "data-checkout-card-type" index.html
          grep -q "cash-change-for" index.html
          grep -q "card_credit" index.html
          grep -q "Taxa da maquininha" index.html

      - name: Commit feature and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch_payment.py .github/workflows/apply-payment-options.yml .github/workflows/apply-payment-options-v2.yml
          git add -A
          git commit -m "feat: add card fee and cash change options"
          git push origin HEAD:work-deliverylv
