name: Apply flexible product catalog
on:
  push:
    paths:
      - '.github/workflows/apply-flexible-product-catalog.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply flexible product patch
        run: python3 .github/scripts/flexible_product_catalog.py
      - name: Validate patch
        run: |
          grep -q 'catalogProductSizes' index.html
          grep -q 'data-configure-product' index.html
          grep -q 'item.sizeName' index.html
          git diff --check
      - name: Commit flexible catalog
        run: |
          rm .github/scripts/flexible_product_catalog.py
          rm .github/workflows/apply-flexible-product-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/flexible_product_catalog.py .github/workflows/apply-flexible-product-catalog.yml
          git commit -m "feat: support flexible product sizes"
          git push
