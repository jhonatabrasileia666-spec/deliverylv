name: Apply public order code
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_public_order_code.py'
      - '.github/workflows/apply-public-order-code.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout
        run: python .github/scripts/add_public_order_code.py
      - name: Validate public order code
        run: |
          grep -q "orderCode" index.html
          grep -q "Código do pedido" index.html
          grep -q "order_code" index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_public_order_code.py .github/workflows/apply-public-order-code.yml
          git add -A
          git commit -m "feat: show public order code on checkout"
          git push
