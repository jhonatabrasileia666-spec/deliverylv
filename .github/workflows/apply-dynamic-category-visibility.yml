name: Fix dynamic category visibility
on:
  push:
    paths:
      - '.github/workflows/apply-dynamic-category-visibility.yml'
      - '.github/scripts/fix_dynamic_category_visibility.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_dynamic_category_visibility.py
      - name: Verify marker
        run: grep -q "section.style.display=section.id===target?'block':'none'" index.html
      - name: Commit clean result
        run: |
          rm -f .github/scripts/fix_dynamic_category_visibility.py .github/workflows/apply-dynamic-category-visibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: show dynamic catalog category on click'
          git push
