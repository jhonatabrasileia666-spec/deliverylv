name: Apply storefront prelaunch hardening

on:
  push:
    paths:
      - '.github/workflows/apply-prelaunch-storefront-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/prelaunch_storefront_hardening.py
      - name: Validate markers
        run: |
          grep -q 'id="lv-store-status-module"' index.html
          grep -q 'id="store-status"' index.html
          grep -q 'liveStoreState===false' index.html
          grep -q 'voice-toggle" hidden' index.html
          grep -q 'voice-panel" id="voice-panel" hidden' index.html
          ! grep -q '<span class="open-status"><i class="status-dot"></i>Aberto agora</span>' index.html
      - name: Validate inline scripts parse
        run: |
          python - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              path=f'/tmp/lv-menu-script-{i}.js'
              pathlib.Path(path).write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',path],check=True)
          print('checked',len(scripts),'inline scripts')
          PY
      - name: Commit final code and remove temporary automation
        run: |
          rm -f .github/scripts/prelaunch_storefront_hardening.py .github/workflows/apply-prelaunch-storefront-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce store availability and hide voice AI'
          git push
