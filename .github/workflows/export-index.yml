name: Export current index
on:
  push:
    branches: [work-deliverylv]
    paths:
      - '.github/workflows/export-index.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: deliverylv-index
          path: index.html
          if-no-files-found: error
