name: Add pizza size filter

on:
  push:
    paths:
      - '.github/workflows/add-pizza-size-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply storefront patch
        run: |
          echo ' gY3VzdG9tZXJQaG9uZT0nJyw    nP1tmbGF2b3JJbmZvKHByb2R1Y3QpXTpbXX07Ii5yZXBsYWNlKCJwaXp6YXMgJyIsInBpenphcyciKSwKICAgICIgICAgY29uc3QgaW5pdGlhbFNpemVJbmRleD1jYXRlZ29yeT09PSdwaXp6YXM nP2NvbmZpZ3VyZWRTaXplcy5maW5kSW5kZXgoc2l6ZT0+bm9ybWFsaXplU2l6ZU5hbWUoc2l6ZS5uYW1lKT09PW5vcm1hbGl6ZVNpemVOYW1lKHNlbGVjdGVkUGl6emFDYXRhbG9nU2l6ZSkpOjA7XG4gICAgc2VsZWN0ZWQ9e2lkOnByb2R1Y3QuaWQsbmFtZTpwcm9kdWN0Lm5hbWUsaW5ncmVkaWVudHM6cHJvZHVjdC5kZXNjcmlwdGlvbnx8JycsY2F0ZWdvcnkscHJpY2luZ01vZGUs  c2l6ZXMnKS5yZXBsYWNlKCJwaXp6YXMgJyIsInBpenphcyciKSwKICAgICJvcGVuIHByb2R1Y3QiCikKCnJlcGxhY2Vfb25jZSgKICAgICI gIGRvY3VtZW50LmFkZEV2ZW50TGlzdGVuZXIoJ2NsaWNrJyxldmVudD0+e2NvbnN0IGNvbmZpZ3VyYWJsZT1ldmVudC50YXJnZXQuY2xvc2VzdCgnW2RhdGEtY29uZmlndXJlLXByb2R1Y3RdJyk7Ii5yZXBsYWNlKCc ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              p=Path(f'/tmp/storefront-{i}.js')
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('Inline JavaScript valid')
          PY
      - name: Verify feature markers
        run: |
          grep -q 'data-pizza-catalog-size' index.html
          grep -q "selectedPizzaCatalogSize='Pequena'" index.html
      - name: Commit feature and remove temporary workflow
        run: |
          rm -f .github/workflows/add-pizza-size-filter.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: filter pizza cards by selected size'
          git push
