name: Add pizza size filter

on:
  push:
    paths:
      - '.github/workflows/add-pizza-size-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply storefront patch
        run: python .github/patch_pizza_size.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip():
                  continue
              p=Path(f'/tmp/storefront-{i}.js')
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('Inline JavaScript valid')
          PY
      - name: Verify feature markers
        run: |
          grep -q 'data-pizza-catalog-size' index.html
          grep -q "selectedPizzaCatalogSize='Pequena'" index.html
          grep -q 'pizzaCatalogSizeRow' index.html
      - name: Commit feature and remove temporary files
        run: |
          rm -f .github/workflows/add-pizza-size-filter.yml .github/patch_pizza_size.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: filter pizza cards by selected size'
          git push
