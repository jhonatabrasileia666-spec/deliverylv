name: Apply price addition fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("  const acrescimosPizza={\n    'A Moda do Pizzaiolo':5,\n    'Carne Seca com Catupiry':5\n  };\n\n", ""),
              ("    const acrescimo=Number(acrescimosPizza[product.name]||0);", "    const acrescimo=Number(product.price_addition||0);"),
              ("    const badge=acrescimo>0?`<span class=\"product-badge\">ACRÉSCIMO: ${money(acrescimo)}</span>`:'';\n    return `<article class=\"product\" data-pizza=\"${index}\"><div class=\"product-copy\">${badge}<h3>${product.name}</h3><p>${product.description||'Produto preparado na hora.'}</p><strong class=\"price\">a partir de ${money(Number(product.base_price||37))}</strong></div><img class=\"product-image\" src=\"${product.image_url||pizzaImage}\" alt=\"${product.name}\" loading=\"lazy\"></article>`", "    const badge=acrescimo>0?`<span class=\"product-badge\">ACRÉSCIMO: ${money(acrescimo)}</span>`:'';\n    const precoInicial=Number(product.base_price||37)+acrescimo;\n    return `<article class=\"product\" data-pizza=\"${index}\"><div class=\"product-copy\">${badge}<h3>${product.name}</h3><p>${product.description||'Produto preparado na hora.'}</p><strong class=\"price\">a partir de ${money(precoInicial)}</strong></div><img class=\"product-image\" src=\"${product.image_url||pizzaImage}\" alt=\"${product.name}\" loading=\"lazy\"></article>`"),
              ("db.from('products').select('id,category_id,name,description,base_price,image_url,active,sort_order').eq('active',true).order('sort_order')", "db.from('products').select('id,category_id,name,description,base_price,price_addition,image_url,active,sort_order').eq('active',true).order('sort_order')"),
              ("selected={id:product.id,name:product.name,ingredients:product.description||'',category:'pizzas',size:0,edge:null,qty:1,note:''}", "selected={id:product.id,name:product.name,ingredients:product.description||'',category:'pizzas',size:0,edge:null,qty:1,note:'',priceAddition:Number(product.price_addition||0)}"),
              ("function currentPrice(){return sizes[selected.size][1]+(selected.edge?selected.edge[1]:0)}", "function currentPrice(){return sizes[selected.size][1]+(selected.edge?selected.edge[1]:0)+Number(selected.priceAddition||0)}"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected code not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/fix-price-step2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply pizza price addition"
          git push origin HEAD:main
