name: Apply delivery confirmation code
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_delivery_confirmation_code.py'
      - '.github/workflows/apply-delivery-confirmation-code.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cardapio
        run: python .github/scripts/add_delivery_confirmation_code.py
      - name: Validate markers
        run: |
          grep -q "deliveryCode" index.html
          grep -q "Código de entrega" index.html
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_delivery_confirmation_code.py .github/workflows/apply-delivery-confirmation-code.yml
          git add -A
          git commit -m "feat: add delivery confirmation code to checkout"
          git push
