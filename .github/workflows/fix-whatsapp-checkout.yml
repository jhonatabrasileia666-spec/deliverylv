name: Apply WhatsApp checkout fix
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch-whatsapp.py
      - name: Commit fix and cleanup
        run: |
          rm .github/patch-whatsapp.py
          rm .github/workflows/fix-whatsapp-checkout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/patch-whatsapp.py .github/workflows/fix-whatsapp-checkout.yml
          git diff --cached --check
          git commit -m "fix: send completed checkout to WhatsApp"
          git push
