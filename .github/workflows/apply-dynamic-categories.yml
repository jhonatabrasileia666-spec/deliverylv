name: Apply dynamic catalog categories
on:
  push:
    paths:
      - '.github/workflows/apply-dynamic-categories.yml'
      - '.github/scripts/dynamic_categories.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/dynamic_categories.py
      - name: Verify markers
        run: |
          grep -q 'data-dynamic-category' index.html
          grep -q 'data-dynamic-section' index.html
          grep -q 'simple-thumb' index.html
          grep -q "product_sizes" index.html
      - name: Commit clean result
        run: |
          rm -f .github/scripts/dynamic_categories.py .github/workflows/apply-dynamic-categories.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show custom product categories'
          git push
