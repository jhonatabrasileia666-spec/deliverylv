name: Dynamic catalog categories
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/dynamic_catalog_categories.py'
      - '.github/workflows/dynamic-catalog-categories.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/dynamic_catalog_categories.py
      - name: Commit result and cleanup
        run: |
          rm -f .github/scripts/dynamic_catalog_categories.py .github/workflows/dynamic-catalog-categories.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          git commit -m 'feat: support flexible catalog categories and sizes' || exit 0
          git push
